<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151412" />
    <title>Bhookmark</title>
    <!-- Applies the saved Evening/Daylight choice before first paint so the
         page never flashes the wrong theme. Kept in sync with src/theme.ts. -->
    <script>
      (function () {
        var theme = "evening";
        try {
          var pref = localStorage.getItem("bhookmark.theme");
          if (pref === "daylight") theme = "daylight";
          else if (pref === "system" && window.matchMedia("(prefers-color-scheme: light)").matches) theme = "daylight";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Inter+Tight:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <!-- Google Identity Services (free) — see src/screens/Login.tsx. Loaded
         globally so it's ready before the login screen renders; harmless
         no-op if VITE_GOOGLE_CLIENT_ID isn't configured. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
